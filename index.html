function nekoHead(mood){
  return `<img class="neko" src="${FACE_HEAD[mood]||FACE_HEAD.happy}" alt="선생님 캐릭터" draggable="false">`;
}
/* 흑백 캐릭터가 화면에서 뜨도록 뒤에 까는 빛살 — 금색과 주홍이 번갈아 16갈래.
   안쪽(캐릭터 뒤)과 바깥쪽 끝은 마스크로 흐려서 글씨를 가리지 않습니다. */
const RAYS=(()=>{
  const pt=(r,t)=>(Math.cos(t)*r).toFixed(1)+','+(Math.sin(t)*r).toFixed(1);
  const arm=[[],[]];
  for(let i=0;i<16;i++){
    const a=i*Math.PI/8, w=.05;
    arm[i%2].push('M'+pt(26,a-w)+'L'+pt(98,a-w*2.6)+'L'+pt(98,a+w*2.6)+'L'+pt(26,a+w)+'Z');
  }
  return '<svg class="rays" viewBox="-100 -100 200 200" aria-hidden="true">'
    +'<defs><radialGradient id="nkFade">'
    +'<stop offset=".16" stop-color="#fff" stop-opacity="0"/>'
    +'<stop offset=".44" stop-color="#fff" stop-opacity="1"/>'
    +'<stop offset=".86" stop-color="#fff" stop-opacity="0"/>'
    +'</radialGradient>'
    +'<mask id="nkMask"><rect x="-100" y="-100" width="200" height="200" fill="url(#nkFade)"/></mask>'
    +'</defs>'
    +'<g class="spin" mask="url(#nkMask)">'
    +'<path d="'+arm[0].join('')+'" fill="var(--gold)" opacity=".42"/>'
    +'<path d="'+arm[1].join('')+'" fill="var(--shu)" opacity=".3"/>'
    +'</g></svg>';
})();
function nekoBlock(mood, stampChar, size, grey){
  const party = mood==='cheer';
  return `<div class="nekoblock${party?' party':''}" style="width:${size}px">${party?RAYS:''}
    <div class="neko-${mood}">${neko(mood)}</div>
    ${stampChar?`<div class="stamp jp ${grey?'grey':''}">${stampChar}</div>`:''}
  </div>`;
}

/* ---------------- sound: synthesised, no files ---------------- */
const SND={ctx:null, master:null, sfxBus:null, musBus:null, timer:null, step:0, next:0};
function ac(){
  if(!SND.ctx){
    const C=window.AudioContext||window.webkitAudioContext;
    if(!C) return null;
    try{ SND.ctx=new C(); }catch(e){ return null; }
    SND.master=SND.ctx.createGain(); SND.master.gain.value=.9; SND.master.connect(SND.ctx.destination);
    SND.sfxBus=SND.ctx.createGain(); SND.sfxBus.gain.value=.5; SND.sfxBus.connect(SND.master);
    SND.musBus=SND.ctx.createGain(); SND.musBus.gain.value=0; SND.musBus.connect(SND.master);
  }
  if(SND.ctx.state==='suspended') SND.ctx.resume().catch(()=>{});
  return SND.ctx;
}
function pluck(freq, at, dur, gain, type, bus){
  const c=SND.ctx; if(!c) return;
  const o=c.createOscillator(), g=c.createGain();
  o.type=type||'triangle'; o.frequency.setValueAtTime(freq, at);
  g.gain.setValueAtTime(0, at);
  g.gain.linearRampToValueAtTime(gain, at+.014);
  g.gain.exponentialRampToValueAtTime(.0001, at+dur);
  o.connect(g); g.connect(bus||SND.sfxBus);
  o.start(at); o.stop(at+dur+.06);
}
function noise(at, dur, gain){
  const c=SND.ctx; if(!c) return;
  const n=Math.floor(c.sampleRate*dur), buf=c.createBuffer(1,n,c.sampleRate), d=buf.getChannelData(0);
  for(let i=0;i<n;i++) d[i]=(Math.random()*2-1)*(1-i/n);
  const s=c.createBufferSource(); s.buffer=buf;
  const f=c.createBiquadFilter(); f.type='bandpass'; f.frequency.value=1600;
  const g=c.createGain(); g.gain.value=gain;
  s.connect(f); f.connect(g); g.connect(SND.sfxBus); s.start(at);
}
const YO=[261.63,293.66,349.23,392.00,440.00,523.25,587.33,698.46];  // 요나누키 음계
function sfx(name, lvl){
  if(!S.sfxOn) return;
  const c=ac(); if(!c) return;
  const t=c.currentTime;
  /* 연속으로 맞히면 같은 소리가 반음씩 올라갑니다 — 쌓이는 느낌이 납니다 */
  const up=Math.pow(2, Math.min(Math.max(lvl|0,0),8)/12);
  if(name==='correct'){
    pluck(YO[3]*up,t,.5,.3);pluck(YO[5]*up,t+.07,.55,.26);pluck(YO[7]*up,t+.14,.7,.2,'sine');
  } else if(name==='combo'){

const MEL=[0,2,4,2, 5,4,2,0, 1,3,5,3, 4,2,0,2];

const RM = matchMedia('(prefers-reduced-motion: reduce)').matches;
const FX={c:null,x:null,p:[],raf:0};
const PET={c:null,x:null,p:[],raf:0,w:0,h:0};
function fitCanvas(cv){
  const d=Math.min(window.devicePixelRatio||1,2);
  cv.width=Math.floor(innerWidth*d); cv.height=Math.floor(innerHeight*d);
  const cx=cv.getContext('2d'); cx.setTransform(d,0,0,d,0,0);
  return cx;
}
function initCanvases(){
  FX.c=document.getElementById('fxc'); FX.x=fitCanvas(FX.c);
  PET.c=document.getElementById('petals'); PET.x=fitCanvas(PET.c);
  PET.w=innerWidth; PET.h=innerHeight;
  addEventListener('resize',()=>{ FX.x=fitCanvas(FX.c); PET.x=fitCanvas(PET.c); PET.w=innerWidth; PET.h=innerHeight; });
}
function petal(x,y){
  return {x, y, r:5+Math.random()*5, vy:.35+Math.random()*.5, vx:-.25+Math.random()*.5,
          a:Math.random()*6.28, va:(-.5+Math.random())*.02, sw:.4+Math.random()*.6, o:.35+Math.random()*.35};
}
function drawPetal(x,p){
  x.save(); x.translate(p.x,p.y); x.rotate(p.a); x.scale(p.sw,1);
  x.globalAlpha=p.o; x.fillStyle='#F0A9B4';
  x.beginPath();
  x.moveTo(0,-p.r);
  x.bezierCurveTo(p.r*.9,-p.r*.5, p.r*.7,p.r*.7, 0,p.r);
  x.bezierCurveTo(-p.r*.7,p.r*.7, -p.r*.9,-p.r*.5, 0,-p.r);
  x.fill(); x.restore();
}
function petalsOn(){
  if(RM || !PET.x) return;
  if(!PET.p.length) for(let i=0;i<16;i++) PET.p.push(petal(Math.random()*PET.w, Math.random()*PET.h));
  if(PET.raf) return;
  const loop=()=>{
    const x=PET.x; x.clearRect(0,0,PET.w,PET.h);
    PET.p.forEach(p=>{
      p.y+=p.vy; p.x+=p.vx+Math.sin(p.y/60)*.3; p.a+=p.va;
      if(p.y>PET.h+16){ p.y=-16; p.x=Math.random()*PET.w; }
      if(p.x<-20) p.x=PET.w+18; if(p.x>PET.w+20) p.x=-18;
      drawPetal(x,p);
    });
    PET.raf=requestAnimationFrame(loop);
  };
  loop();
}
function petalsOff(){
  if(PET.raf) cancelAnimationFrame(PET.raf);
  PET.raf=0;
  if(PET.x) PET.x.clearRect(0,0,innerWidth,innerHeight);
}
const CONF=['#D2452E','#23406E','#E0B34A','#F0A9B4','#4E9A72'];
function burst(cx,cy,n,power){
  if(RM || !FX.x) return;
  for(let i=0;i<n;i++){
    const a=-Math.PI/2 + (Math.random()-.5)*2.2, sp=(2.5+Math.random()*5)*(power||1);
    FX.p.push({x:cx,y:cy,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,
      w:4+Math.random()*7,h:3+Math.random()*6,c:CONF[(Math.random()*CONF.length)|0],
      a:Math.random()*6.28,va:(-.5+Math.random())*.35,life:1,round:Math.random()<.3});
  }
  fxLoop();
}
function fxLoop(){
  if(FX.raf) return;
  const step=()=>{
    const x=FX.x; x.clearRect(0,0,innerWidth,innerHeight);
    FX.p=FX.p.filter(p=>p.life>0);
    FX.p.forEach(p=>{
      p.vy+=.22; p.vx*=.99; p.x+=p.vx; p.y+=p.vy; p.a+=p.va; p.life-=.011;
      x.save(); x.translate(p.x,p.y); x.rotate(p.a);
      x.globalAlpha=Math.max(0,Math.min(1,p.life*1.6)); x.fillStyle=p.c;
      if(p.round){ x.beginPath(); x.arc(0,0,p.w/2,0,6.283); x.fill(); }
      else x.fillRect(-p.w/2,-p.h/2,p.w,p.h);
      x.restore();
    });
    if(FX.p.length) FX.raf=requestAnimationFrame(step);
    else { FX.raf=0; x.clearRect(0,0,innerWidth,innerHeight); }
  };
  FX.raf=requestAnimationFrame(step);
}

/* ---------------- speech ---------------- */
const TTS = ('speechSynthesis' in window);
let JA_VOICE=null, VOICES_SEEN=false;
function loadVoices(){
  if(!TTS) return;
  const vs=speechSynthesis.getVoices()||[];
  if(vs.length){ VOICES_SEEN=true; JA_VOICE=vs.find(v=>v.lang&&v.lang.toLowerCase().indexOf('ja')===0)||null; }
}
if(TTS){ loadVoices(); speechSynthesis.addEventListener('voiceschanged', loadVoices); }

/* iOS·사파리는 사용자가 화면을 한 번 건드리기 전에는 소리를 내주지 않습니다.
   첫 터치 때 조용한 발화를 흘려보내 음성 엔진을 깨워 둡니다.              */
let TTS_WARM=false;
function warmTTS(){
  if(!TTS || TTS_WARM) return;
  TTS_WARM=true;
  try{
    loadVoices();
    const u=new SpeechSynthesisUtterance(' ');
    u.volume=0; u.lang='ja-JP';
    speechSynthesis.speak(u);
  }catch(e){}
}
let TTS_REAL=0, TTS_AT=0;
function speak(text, slow){
  if(!TTS||!text) return;
  try{
    warmTTS();
    /* 진짜 소리가 나는 중이거나 대기열이 막혀 있을 때만 끊습니다 */
    const busy = (TTS_REAL>0 && (Date.now()-TTS_AT)<15000) || speechSynthesis.pending;
    if(busy){ speechSynthesis.cancel(); TTS_REAL=0; }
    const go=()=>{
      try{
        const u=new SpeechSynthesisUtterance(text);
        u.lang='ja-JP'; u.rate= slow ? .45 : .82; u.pitch=1;
        if(JA_VOICE) u.voice=JA_VOICE;
        u.onend=u.onerror=()=>{ TTS_REAL=Math.max(0,TTS_REAL-1); };
        TTS_REAL++; TTS_AT=Date.now();
        speechSynthesis.speak(u);
      }catch(e){}
    };
    /* 사파리는 cancel 직후 바로 말하면 삼키는 일이 있어, 끊었을 때만 한 박자 둡니다 */
    if(busy) setTimeout(go, 60); else go();
  }catch(e){}
}
/* 스피커 버튼은 음성 기능만 있으면 보여 줍니다 */
const canSpeak = () => TTS;
/* 듣기 '문제'는 일본어 목소리가 확인될 때만 냅니다 */
function audioOK(){ return TTS && (JA_VOICE || !VOICES_SEEN); }

const KANA_RE=/^[ぁ-んー]+$/;

function mcqMeaning(it,W,kana){ return {kind:'mcq', q:kana?'읽는 법을 고르세요':'뜻을 고르세요', jp:it.j, kana:it.k, audio:it.k,
  options:opts4(it.m, [W, ALL_WORDS], x=>x.m), answer:it.m, item:it}; }
function mcqWord(it,W,kana){ return {kind:'mcq', q:kana?'맞는 글자를 고르세요':'일본어를 고르세요', ko:it.m, jpOpts:true,
  options:opts4(it.j, [W, ALL_WORDS], x=>x.j), answer:it.j, item:it}; }
function listenEx(it,W,kana){ return {kind:'listen', q:kana?'들리는 글자를 고르세요':'들리는 것을 고르세요', audio:it.k, jpOpts:true,
  options:opts4(it.j, [W, ALL_WORDS], x=>x.j), answer:it.j, item:it}; }
function typeEx(it,kana){ return {kind:'type', q:kana?'그 글자를 눌러 보세요':'히라가나로 입력하세요', ko:it.m, audio:it.k, answer:it.k, item:it}; }
function assembleEx(st){ return {kind:'assemble', q:'단어를 배열해 문장을 만드세요', ko:st.m, audio:st.k,
  tokens:scramble(st.t), answer:st.t.join(' '), item:st}; }
function sentMcq(st,SS){ return {kind:'mcq', q:'뜻을 고르세요', jp:st.j, kana:st.k, audio:st.k,
  options:opts4(st.m, [SS, ALL_SENT], x=>x.m), answer:st.m, item:st}; }
function scramble(t){
  if(t.length<2) return t.slice();
  let o=shuffle(t), g=0;
  while(o.join('|')===t.join('|') && g++<60) o=shuffle(t);
  return o;
}

function makeExercises(lesson){
  const ws=lesson.w, ss=lesson.s, ex=[];
  const W = UNITS[lesson.unit] ? UNITS[lesson.unit].w : ALL_WORDS;   // same-unit distractors
  const SS = UNITS[lesson.unit] ? UNITS[lesson.unit].s : ALL_SENT;
  const typable=ws.filter(w=>KANA_RE.test(w.k)&&w.k.length<=5);
  const KN = !!(UNITS[lesson.unit] && UNITS[lesson.unit].kana);

  if(ss.length){
    shuffle(ss).forEach((st,i)=>{
      ex.push(assembleEx(st));
      if(i%2===0) ex.push(sentMcq(st,SS));
    });
    pick(typable, Math.min(2,typable.length)).forEach(w=>ex.push(typeEx(w)));
    if(audioOK()) pick(ws,2).forEach(w=>ex.push(listenEx(w,W)));
    if(lesson.review && ws.length>=5) ex.push({kind:'match', q:'짝을 맞추세요', pairs:pick(ws,5)});
  } else {
    shuffle(ws).forEach((it,i)=>{ ex.push(i%2 ? mcqWord(it,W,KN) : mcqMeaning(it,W,KN)); });
    if(ws.length>=5) ex.push({kind:'match', q:'짝을 맞추세요', pairs:pick(ws,5)});
    if(audioOK()) pick(ws,2).forEach(it=>ex.push(listenEx(it,W,KN)));
    pick(typable, Math.min(3,typable.length)).forEach(it=>ex.push(typeEx(it,KN)));
  }

  const match=ex.filter(e=>e.kind==='match');
  const rest=shuffle(ex.filter(e=>e.kind!=='match'));
  const cap=lesson.review?13:10;
  const out=rest.slice(0,cap-match.length);
  if(match.length) out.splice(Math.min(3,out.length),0,...match);
  return out;
}

/* ===== 진도 병합 =====
   두 기기에서 각각 학습한 결과를 합칩니다. 덮어쓰기가 아니라 합치기입니다.
   원칙: 어느 쪽에서든 한 번 이룬 진전은 사라지지 않는다. */

function dayNum(k){                       // 'YYYY-M-D' → 비교 가능한 숫자
  if(!k || typeof k!=='string') return -1;
  const p=k.split('-').map(Number);
  if(p.length!==3 || p.some(isNaN)) return -1;
  return p[0]*10000 + p[1]*100 + p[2];
}

function mergeProgress(a, b){
  if(!a) return b ? JSON.parse(JSON.stringify(b)) : null;
  if(!b) return JSON.parse(JSON.stringify(a));
  const out = {};

  // XP: 누적값이라 더하면 이중 계산이 됩니다. 더 많이 쌓인 쪽을 씁니다.
  out.xp = Math.max(a.xp|0, b.xp|0);

  // 레슨: 같은 레슨이면 별점이 높은 쪽
  out.done = Object.assign({}, a.done||{});
  const bd = b.done||{};
  for(const k in bd) out.done[k] = Math.max(out.done[k]|0, bd[k]|0);

  // 복습 일정: 항목별로 더 많이 익힌 쪽(상자가 높은 쪽).
  // 상자가 같으면 다음 복습이 더 뒤인 쪽 = 더 최근에 푼 쪽.
  out.srs = {};
  const as=a.srs||{}, bs=b.srs||{};
  for(const k of new Set([...Object.keys(as), ...Object.keys(bs)])){
    const x=as[k], y=bs[k];
    if(!x){ out.srs[k]=y; continue; }
    if(!y){ out.srs[k]=x; continue; }
    if((y.b|0) > (x.b|0)) out.srs[k]=y;
    else if((y.b|0) < (x.b|0)) out.srs[k]=x;
    else out.srs[k] = ((y.d|0) > (x.d|0)) ? y : x;
  }

  // 오답 노트: 합집합. 한쪽에서 틀렸으면 여전히 복습 대상입니다.
  out.mistakes = [...new Set([...(a.mistakes||[]), ...(b.mistakes||[])])];

  // 이미 본 문법 카드: 합집합
  out.seenG = Object.assign({}, a.seenG||{}, b.seenG||{});

  // 연속 학습일: 마지막 학습일이 더 뒤인 쪽의 기록을 따릅니다.
  // 같은 날이면 더 긴 쪽.
  const da=dayNum(a.last), db=dayNum(b.last);
  if(db > da){ out.last=b.last; out.streak=b.streak|0; }
  else if(da > db){ out.last=a.last; out.streak=a.streak|0; }
  else { out.last=a.last||b.last||null; out.streak=Math.max(a.streak|0, b.streak|0); }

  // 배지: 합집합. 먼저 얻은 날짜를 남깁니다.
  out.badges = Object.assign({}, b.badges||{}, a.badges||{});
  const bb=b.badges||{};
  for(const k in bb) if(!out.badges[k] || bb[k] < out.badges[k]) out.badges[k]=bb[k];

  // 학습한 날: 합집합 (최근 120일만)
  out.act = [...new Set([...(a.act||[]), ...(b.act||[])])].slice(-120);

  // 무결점 레슨 수 · 하루 목표: 더 큰 쪽 / 최근 쪽
  out.perfects = Math.max(a.perfects|0, b.perfects|0);
  out.goal = (db > da ? b.goal : a.goal) || a.goal || b.goal || 260;

  return out;
}

/* ===== 완주 =====
   트랙 하나를 끝냈을 때와 전부 끝냈을 때, 그냥 홈으로 돌려보내지 않습니다. */
const TRACK_NAME = {kana:'문자', main:'단어와 문장', n4:'N4'};
function trackDone(t){

/* 방금 끝낸 레슨으로 새로 완주된 것이 있으면 그 이름을 돌려줍니다. */
function newlyFinished(){
  if(allDone() && !S.doneAt.all){ S.doneAt.all=Date.now(); save(); return 'all'; }
  for(const t of Object.keys(TRACKS))
    if(trackDone(t) && !S.doneAt[t]){ S.doneAt[t]=Date.now(); save(); return t; }
  return null;
}

function daysSince(){
  if(!S.firstDay) return null;
  const a=S.firstDay.split('-').map(Number);
  const d=Math.round((Date.now()-new Date(a[0],a[1]-1,a[2]).getTime())/864e5);
  return d<1?1:d;
}

const CLOUD = {

  on(fn){ this.listeners.push(fn); },
  emit(){ this.listeners.forEach(f=>{ try{ f(); }catch(e){} }); },
  set(st){ this.status=st; this.emit(); },

  /* 아티팩트처럼 외부 통신이 막힌 환경에서는 조용히 꺼진 채로 둡니다. */
  async init(){
    if(this.ready || this.status==='loading') return;
    this.status='loading';
    try{
      const [{initializeApp}, auth, fs] = await Promise.all([

      this.ready = true;
      this.set('out');

        this.user = u;
        if(u){ await this.pull(); } else { this.set('out'); }
      });
    }catch(e){
      this.ready=false; this.set('off');       // 통신 불가 — 로컬 전용으로 계속
    }
  },

  idToEmail(id){ return String(id).trim().toLowerCase() + ID_DOMAIN; },
  nameOf(){ const e=this.user&&this.user.email||''; return e.replace(ID_DOMAIN,''); },

  async signUp(id, pw){
    const {createUserWithEmailAndPassword}=this.api.a;
    await createUserWithEmailAndPassword(this.api.auth, this.idToEmail(id), pw);
  },
  async signIn(id, pw){
    const {signInWithEmailAndPassword}=this.api.a;
    await signInWithEmailAndPassword(this.api.auth, this.idToEmail(id), pw);
  },
  async signOut(){
    try{ await this.api.a.signOut(this.api.auth); }catch(e){}
    this.user=null; this.set('out');
  },

  doc(){ return this.api.f.doc(this.api.fs, 'progress', this.user.uid); },

  /* 서버 진도를 가져와 지금 것과 합칩니다. 어느 쪽 진전도 잃지 않습니다. */
  async pull(){
    if(!this.user) return;
    this.set('sync');
    try{
      const snap = await this.api.f.getDoc(this.doc());
      const remote = snap.exists() ? (snap.data().data || null) : null;
      const merged = mergeProgress(snapshotOf(S), remote);
      if(merged) applyProgress(merged);
      await this.push(true);
      this.set('in');
    }catch(e){ this.set('err'); }
  },

  /* 저장은 몰아서 보냅니다 — 문제 하나 풀 때마다 보내지 않습니다. */
  queue(){
    if(!this.user || !this.ready) return;
    clearTimeout(this.timer);
    this.timer = setTimeout(()=>this.push(), 1500);
  },
  async push(quiet){
    if(!this.user || !this.ready) return;
    if(!quiet) this.set('sync');
    try{
      await this.api.f.setDoc(this.doc(), { data: snapshotOf(S), at: Date.now() });
      if(!quiet) this.set('in');
    }catch(e){ this.set('err'); }
  }
};

/* 서버에 올리고 내리는 것은 진도뿐입니다 — 테마·소리 설정은 기기별로 둡니다. */
function snapshotOf(s){
  return { xp:s.xp|0, streak:s.streak|0, last:s.last||null,
           done:s.done||{}, mistakes:s.mistakes||[], srs:s.srs||{}, seenG:s.seenG||{},
           badges:s.badges||{}, act:s.act||[], perfects:s.perfects|0, goal:s.goal||260 };
}
function applyProgress(p){
  S.xp=p.xp|0; S.streak=p.streak|0; S.last=p.last||null;
  S.done=p.done||{}; S.mistakes=p.mistakes||[]; S.srs=p.srs||{}; S.seenG=p.seenG||{};
  if(p.badges) S.badges=p.badges;
  if(p.act) S.act=p.act;
  if(p.perfects!=null) S.perfects=p.perfects|0;
  if(p.goal) S.goal=p.goal;
  save();
}

/* ---------------- 진행 상황 백업 ----------------
   기기 간 자동 동기화는 이 환경에서 제공되지 않습니다.
   대신 진도 전체를 한 덩어리 코드로 뽑아 두었다가 다른 기기에서 되돌릴 수 있게 합니다. */
const BK_TAG='NIHONGODOJO';
function b64enc(bytes){
  let s='';
  for(let i=0;i<bytes.length;i+=0x8000) s+=String.fromCharCode.apply(null, bytes.subarray(i,i+0x8000));
  return btoa(s).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
}
function b64dec(str){
  const b=atob(str.replace(/-/g,'+').replace(/_/g,'/'));
  const out=new Uint8Array(b.length);
  for(let i=0;i<b.length;i++) out[i]=b.charCodeAt(i);
  return out;
}
async function makeBackup(){
  const payload={v:1, xp:S.xp, streak:S.streak, last:S.last, done:S.done,
                 mistakes:S.mistakes, srs:S.srs, seenG:S.seenG};
  const bytes=new TextEncoder().encode(JSON.stringify(payload));
  if(typeof CompressionStream==='function'){
    try{
      const buf=await new Response(new Blob([bytes]).stream()
        .pipeThrough(new CompressionStream('gzip'))).arrayBuffer();
      return BK_TAG+'Z'+b64enc(new Uint8Array(buf));
    }catch(e){}
  }
  return BK_TAG+'P'+b64enc(bytes);
}
async function readBackup(code){
  const t=String(code).trim().replace(/\s+/g,'');
  if(t.indexOf(BK_TAG)!==0) throw new Error('형식이 맞지 않습니다');
  const mode=t[BK_TAG.length], body=t.slice(BK_TAG.length+1);
  if(!body) throw new Error('내용이 비어 있습니다');
  let bytes;
  try{ bytes=b64dec(body); }catch(e){ throw new Error('코드가 손상되었습니다'); }
  if(mode==='Z'){
    if(typeof DecompressionStream!=='function') throw new Error('이 브라우저에서는 이 코드를 풀 수 없습니다');
    try{
      const buf=await new Response(new Blob([bytes]).stream()
        .pipeThrough(new DecompressionStream('gzip'))).arrayBuffer();
      bytes=new Uint8Array(buf);
    }catch(e){ throw new Error('코드가 손상되었습니다 — 일부만 복사되지 않았는지 확인해 주세요'); }
  } else if(mode!=='P') throw new Error('알 수 없는 형식입니다');
  let o;
  try{ o=JSON.parse(new TextDecoder().decode(bytes)); }
  catch(e){ throw new Error('코드가 손상되었습니다'); }
  if(!o || typeof o!=='object' || !o.done || typeof o.done!=='object') throw new Error('진행 정보를 찾을 수 없습니다');
  return o;
}
function backupStats(o){
  const lessons=Object.keys(o.done||{}).length;
  const items=Object.keys(o.srs||{}).length;
  return lessons+'개 레슨 · 복습 항목 '+items+'개 · XP '+(o.xp||0);
}

function startLesson(lesson, skipGrammar){

  /* 복습은 하트가 없어도 할 수 있습니다 — 하트를 채우는 길이기 때문입니다 */
  if(!lesson.isReview && hpNow()<=0) return heartSheet();
  const u=UNITS[lesson.unit];
  if(!skipGrammar && lesson.pos===0 && u && u.grammar && !S.seenG[u.id]){
    S.seenG[u.id]=1; save();
    return showGrammar(u, ()=>startLesson(lesson, true));
  }
  const ex=makeExercises(lesson);
  if(!ex.length) return renderHome();
  plusMix(ex, lesson);
  G=newGame(lesson, ex);
  renderExercise();
}

  }
  else if(e.kind==='listen'){
    body=`<div class="prompt-label">${esc(e.q)}${combo}</div>
      <div style="margin:6px 0 2px">${say(e.audio, true)}</div>
      <div class="qhint">소리를 듣고 알맞은 것을 고르세요.</div>
      <div class="opts">${e.options.map(o=>`<button class="opt jp" data-v="${esc(o)}">${esc(o)}</button>`).join('')}</div>`;
    footer=`<button class="cta" id="check" disabled>확인</button>`;
  }
  else if(e.kind==='assemble'){
    body=`<div class="prompt-label">${esc(e.q)}${combo}</div>
      <div class="qko">${esc(e.ko)}</div>
      ${e.audio?`<div style="margin-top:16px">${say(e.audio)}</div>`:''}
      <div class="answerline" id="ansLine"></div>
      <div class="answerline second"></div>
      <div class="bank" id="bank">${e.tokens.map((t,i)=>`<button class="tok jp" data-i="${i}">${esc(t)}</button>`).join('')}</div>`;
    footer=`<button class="cta" id="check" disabled>확인</button>`;
  }
  else if(e.kind==='match'){
    const L=shuffle(e.pairs), R=shuffle(e.pairs);
    G.ms={sel:null, miss:0, left:e.pairs.length};
    let cells='';
    for(let i=0;i<L.length;i++){
      cells+=`<button class="mcard jpc jp" data-k="${esc(L[i].j)}" data-side="l">${esc(L[i].j)}</button>`;
      cells+=`<button class="mcard" data-k="${esc(R[i].j)}" data-side="r">${esc(R[i].m)}</button>`;
    }
    body=`<div class="prompt-label">${esc(e.q)}${combo}</div>
      <div class="qhint" style="margin-top:0">일본어와 뜻을 하나씩 눌러 연결하세요.</div>
      <div class="matchgrid">${cells}</div>`;
    footer=`<button class="cta" disabled>남은 짝 <span id="remain" class="mono">${e.pairs.length}</span></button>`;
  }
  else if(e.kind==='type'){
    body=`<div class="prompt-label">${esc(e.q)}${combo}</div>
      <div class="qko">${esc(e.ko)}</div>
      ${e.audio?`<div style="margin-top:14px">${say(e.audio)}</div>`:''}
      <div class="typebox jp"><span id="typed"></span><span class="caret"></span></div>
      <div class="kbd" id="kbd">${kbdHTML()}</div>`;
    footer=`<button class="cta" id="check" disabled>확인</button>`;
  }

  if(e.kind==='speak'){ const r=speakExHTML(e, combo); body=r.body; footer=r.footer; }
  if(e.dict) body=dictBody(body, e, combo, say);
  app.innerHTML=shell(body, footer);
  midCheer();
  petalsOff();
  $('#quitBtn').onclick=confirmQuit;
  app.querySelectorAll('[data-say]').forEach(b=>b.onclick=ev=>{
    ev.preventDefault(); ev.stopPropagation();
    speak(b.dataset.say, b.dataset.slow==='1');
  });
  $('#fbBtn').onclick=next;

  if(e.kind==='mcq'||e.kind==='listen') bindOptions(e);
  else if(e.kind==='assemble') bindAssemble(e);
  else if(e.kind==='match') bindMatch(e);
  else if(e.kind==='type') bindType(e);
  else if(e.kind==='speak') bindSpeakEx(e);
  if(e.kind==='listen') setTimeout(()=>speak(e.audio), 380);
  if(e.dict) setTimeout(()=>speak(sayText(e)), 380);
  window.scrollTo(0,0);
}

function confirmQuit(){
  openSheet('레슨을 그만둘까요?','지금 나가면 이번 레슨의 진행 상황은 저장되지 않아요.',
    '계속 학습하기', closeSheet, '나가기', ()=>{ closeSheet(); renderHome(); });
}
function bindOptions(e){
  const chk=$('#check');
  app.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{
    if(G.answered) return;
    app.querySelectorAll('.opt').forEach(x=>x.classList.remove('sel'));
    b.classList.add('sel'); G.sel=b.dataset.v; chk.disabled=false;
    if(e.kind==='mcq') optTap(e, b); else sfx('tap');
  });
  chk.onclick=()=>judge(G.sel===e.answer, e.answer);
}
function bindAssemble(e){
  const line=$('#ansLine'), bank=$('#bank'), chk=$('#check');
  function paint(){
    line.innerHTML=G.built.map((b,i)=>`<button class="tok jp" data-back="${i}">${esc(b.t)}</button>`).join('');
    bank.querySelectorAll('.tok').forEach(t=>t.classList.toggle('ghost', G.built.some(b=>b.i===+t.dataset.i)));
    line.querySelectorAll('[data-back]').forEach(t=>t.onclick=()=>{
      if(G.answered) return;
      G.built.splice(+t.dataset.back,1); paint();
    });
    chk.disabled = G.built.length!==e.tokens.length;
  }
  bank.querySelectorAll('.tok').forEach(t=>t.onclick=()=>{
    if(G.answered||t.classList.contains('ghost')) return;
    const word=e.tokens[+t.dataset.i];
    speak(word);                       // 고른 낱말을 하나씩 들려줍니다
    G.built.push({i:+t.dataset.i, t:word}); paint();
  });
  paint();
  chk.onclick=()=>judge(G.built.map(b=>b.t).join(' ')===e.answer, e.answer);
}
function bindMatch(e){
  const ms=G.ms;
  app.querySelectorAll('.mcard').forEach(c=>c.onclick=()=>{
    if(G.answered||c.classList.contains('gone')) return;
    if(c.dataset.side==='l'){                       // 일본어 카드는 누를 때마다 들려줍니다
      const w0=e.pairs.find(p=>p.j===c.dataset.k); if(w0) speak(w0.k||w0.j);
    }
    if(!ms.sel){ ms.sel=c; c.classList.add('sel'); return; }
    if(ms.sel===c){ c.classList.remove('sel'); ms.sel=null; return; }
    if(ms.sel.dataset.side===c.dataset.side){ ms.sel.classList.remove('sel'); ms.sel=c; c.classList.add('sel'); return; }
    if(ms.sel.dataset.k===c.dataset.k){
      const w=e.pairs.find(p=>p.j===c.dataset.k); if(w) speak(w.k);
      sfx('pair');
      const r=c.getBoundingClientRect(); burst(r.left+r.width/2, r.top+r.height/2, 10, .6);
      const a=ms.sel; a.classList.remove('sel');
      a.classList.add('gone'); c.classList.add('gone'); ms.sel=null;
      ms.left--; $('#remain').textContent=ms.left;
      if(ms.left===0) setTimeout(()=>judge(ms.miss===0, null, ms.miss), 260);
    } else {
      ms.miss++; sfx('wrong');
      const a=ms.sel, b=c;
      a.classList.add('bad'); b.classList.add('bad');
      setTimeout(()=>{ a.classList.remove('bad','sel'); b.classList.remove('bad'); }, 420);
      ms.sel=null;
    }
  });
}

const KANA_ROWS=[
  ['あ','い','う','え','お'],['か','き','く','け','こ'],['さ','し','す','せ','そ'],
  ['た','ち','つ','て','と'],['な','に','ぬ','ね','の'],['は','ひ','ふ','へ','ほ'],
  ['ま','み','む','め','も'],['や','','ゆ','','よ'],['ら','り','る','れ','ろ'],
  ['わ','','を','','ん']
];
const DAKU={か:'が',き:'ぎ',く:'ぐ',け:'げ',こ:'ご',さ:'ざ',し:'じ',す:'ず',せ:'ぜ',そ:'ぞ',
  た:'だ',ち:'ぢ',つ:'づ',て:'で',と:'ど',は:'ば',ひ:'び',ふ:'ぶ',へ:'べ',ほ:'ぼ'};
const HANDAKU={は:'ぱ',ひ:'ぴ',ふ:'ぷ',へ:'ぺ',ほ:'ぽ'};
const SMALL={や:'ゃ',ゆ:'ゅ',よ:'ょ',つ:'っ',あ:'ぁ',い:'ぃ',う:'ぅ',え:'ぇ',お:'ぉ'};
function kbdHTML(){
  let h=KANA_ROWS.map(r=>`<div class="krow">${r.map(k=>k
    ? `<button class="key jp" data-k="${k}">${k}</button>`
    : `<button class="key empty" disabled tabindex="-1"></button>`).join('')}</div>`).join('');
  h+=`<div class="krow">
    <button class="key util" data-op="daku" aria-label="탁음">゛</button>
    <button class="key util" data-op="handaku" aria-label="반탁음">゜</button>
    <button class="key util" data-op="small">작게</button>
    <button class="key jp" data-k="ー">ー</button>
    <button class="key util" data-op="del">지우기</button>
  </div>`;
  return h;
}
function bindType(e){
  const out=$('#typed'), chk=$('#check');
  const paint=()=>{ out.textContent=G.typed; chk.disabled=!G.typed.length; };
  $('#kbd').querySelectorAll('.key').forEach(k=>k.onclick=()=>{
    if(G.answered) return;
    const op=k.dataset.op;
    if(op==='del') G.typed=G.typed.slice(0,-1);
    else if(op){
      const last=G.typed.slice(-1);
      const map = op==='daku'?DAKU : op==='handaku'?HANDAKU : SMALL;
      if(map[last]) G.typed=G.typed.slice(0,-1)+map[last];
    } else if(k.dataset.k) G.typed+=k.dataset.k;
    sfx('tap'); paint();
  });
  paint();
  chk.onclick=()=>judge(G.typed===e.answer, e.answer);
}

/* ---------------- 7. JUDGE + FEEDBACK ---------------- */
/* 이 문제에서 들려줄 일본어 — 읽는 법(k)이 있으면 그쪽이 정확합니다 */
function sayText(e){
  if(!e) return null;
  if(e.audio) return e.audio;
  if(e.item) return e.item.k || e.item.j || null;
  return null;
}
function fbSay(e){
  const t=sayText(e);
  return (t && canSpeak())
    ? ` <button class="fb-say" data-say="${esc(t)}" aria-label="정답 듣기">${ICON.sound}</button>`
     + `<button class="fb-say" data-say="${esc(t)}" data-slow="1" aria-label="정답 느리게 듣기">${ICON.turtle}</button>`
    : '';
}

function judge(ok, correct, missCount){
  if(G.answered) return;
  G.answered=true;
  const e=G.queue[G.i];

  if(e.kind==='mcq'||e.kind==='listen'){
    app.querySelectorAll('.opt').forEach(b=>{
      if(b.dataset.v===e.answer) b.classList.add('right');
      else if(b.classList.contains('sel')) b.classList.add('wrong');
      b.classList.remove('sel');
    });
  }

  const wasKnown = !!(e.item && S.srs[srsKey(e.item)]);   // 이미 익힌 항목 = 복습

  let gain=0;
  if(ok){
    G.cleared++; G.combo++; G.best=Math.max(G.best,G.combo);
    gain = 10 + (G.combo>=5?5:0) + (e.kind==='assemble'||e.kind==='type'?5:0);
    G.xp+=gain;
    sfx(G.combo>=5?'combo':'correct', G.combo-1);
    burst(innerWidth/2, innerHeight-130, G.combo>=5?46:28, G.combo>=5?1.25:1);
    xpPop(gain);
    comboCheer(G.combo);
    speak(sayText(e));
    if(!FREE_MODE){                       // 자유 복습은 일정을 앞당기지 않습니다
      if(e.item) srsTouch(e.item, true);
      if(e.kind==='match' && e.pairs) e.pairs.forEach(p=>srsTouch(p, true));
      if(e.item || e.pairs) save();
    }
    /* 오늘의 과제 진행 */
    const dn=[];
    if(e.kind==='listen') dn.push(...questBump('listen',1));
    if(e.item && e.item.t) dn.push(...questBump('sent',1));
    if(wasKnown) dn.push(...questBump('srs',1));
    const cq=(S.quests&&S.quests.list||[]).find(q=>q.id==='combo');
    if(cq && !cq.got && G.combo>cq.prog){
      cq.prog=Math.min(cq.need,G.combo);
      if(cq.prog>=cq.need){ cq.got=true; S.xp+=QUEST_XP; addTodayXp(QUEST_XP); S.gem=(S.gem|0)+10; dn.push(cq); }
      save();
    }
    if(dn.length) sfx('quest');
    dn.forEach(q=>toast('과제 완료 · '+questMeta(q.id).t+' <b>+'+QUEST_XP+' XP</b>'));
  } else {
    G.combo=0;
    sfx('wrong'); setTimeout(()=>sfx('heart'),160);
    shakeScreen(true); hitFlash();
    G.hearts=Math.max(0,G.hearts-1); G.lost=(G.lost|0)+1;
    if(!G.lesson.isReview) hpSpend();
    if(e.item){
      G.wrong.push(e.item);
      srsTouch(e.item, false);
      if(e.item.j && ALL_WORDS.some(w=>w.j===e.item.j) && S.mistakes.indexOf(e.item.j)<0){ S.mistakes.push(e.item.j); }
      save();
    }
    if(e.kind==='match' && e.pairs){
      e.pairs.forEach(p=>{ srsTouch(p,false); if(S.mistakes.indexOf(p.j)<0) S.mistakes.push(p.j); });
      save();
    }
    G.queue.push(e); G.total++;
    const hs=app.querySelectorAll('.hearts .h');
    if(hs[G.hearts]) hs[G.hearts].classList.add('off','pop');
  }

  const bar=app.querySelector('.bar>i'); if(bar) bar.style.width=Math.round(G.cleared/G.total*100)+'%';

  if(!ok) setTimeout(()=>speak(sayText(e)), 420);   // 틀렸을 때도 바른 소리를 한 번 들려줍니다

  const dead = G.hearts<=0;
  const fb=$('#fb'), btn=$('#fbBtn');
  $('#fbMark').innerHTML = `<div class="neko-${ok?'happy':'sad'}">${nekoHead(ok?'happy':'sad')}</div>
    <span class="fb-badge jp">${ok?'〇':'✕'}</span>`;
  fb.classList.add(ok?'ok':'no','show');
  const praise=['정답!','좋아요!','すごい！','완벽해요!','바로 그거예요!'];
  if(ok){
    $('#fbTitle').textContent = praise[Math.floor(Math.random()*praise.length)];
    $('#fbBody').innerHTML = (e.item && e.item.m)
      ? `<b>${esc(e.item.j)}</b>${fbSay(e)}　${e.item.k&&e.item.k!==e.item.j?esc(e.item.k)+' · ':''}${esc(e.item.m)}`
      : '다섯 짝을 한 번에 모두 맞혔어요.';
    btn.className='cta shu';
  } else {
    $('#fbTitle').textContent='아쉬워요';
    $('#fbBody').innerHTML = e.kind==='match'
      ? `연결을 ${missCount}번 틀렸어요. 이 문제는 뒤에서 한 번 더 나옵니다.`
      : `정답: <b>${esc(correct||e.answer)}</b>${fbSay(e)}${(e.item&&e.item.m&&e.item.m!==(correct||e.answer))?`　${esc(e.item.m)}`:''}`;
    btn.className='cta';
  }
  fb.querySelectorAll('[data-say]').forEach(b2=>b2.onclick=ev=>{
    ev.preventDefault(); speak(b2.dataset.say, b2.dataset.slow==='1');
  });
  if(dead){ btn.textContent='결과 보기'; btn.onclick=renderFail; }
  else btn.textContent='계속하기';
  $('#mainFooter').style.visibility='hidden';
}
function next(){
  G.i++;
  if(G.i>=G.queue.length) renderResult();
  else renderExercise();
}

/* ---------------- 8. RESULT ---------------- */
function uniqWrong(){ return [...new Map(G.wrong.map(w=>[w.j,w])).values()].slice(0,5); }

function renderResult(){
  if(G.lesson.place) return renderPlaceResult(true);
  const acc=Math.round(G.cleared/G.total*100);
  const stars = (G.lost|0)===0?3 : (G.lost|0)<=2?2 : 1;
  const bonus = (G.lost|0)===0?15:0;
  const RS=resultStats();
  const boostX=boostOn()?2:1;
  const totalXP=(G.xp+bonus)*boostX;

  S.xp+=totalXP;
  if(!G.lesson.isReview) S.done[G.lesson.id]=Math.max(S.done[G.lesson.id]||0, stars);
  else if(G.lesson.id==='__review'){
    const stillWrong=new Set(G.wrong.map(w=>w.j));
    const asked=new Set(G.queue.map(q=>q.item&&q.item.j).filter(Boolean));
    S.mistakes=S.mistakes.filter(j=>!asked.has(j)||stillWrong.has(j));
  }
  /* 복습은 하트를 두 개 채워 줍니다 — 기다리는 대신 공부하게 만드는 길 */
  if(G.lesson.isReview) hpGain(2);
  if(!S.firstDay) S.firstDay=dayKey(new Date());
  bumpStreak();
  /* 7일마다 스트릭 보호막 하나 (최대 두 개) */
  let fzNew=false;
  if(S.streak>0 && S.streak%7===0 && (S.fzGot|0)!==S.streak && (S.freeze|0)<2){
    S.fzGot=S.streak; S.freeze=(S.freeze|0)+1; fzNew=true;
  }

  /* ---- 오늘 기록 · 과제 · 배지 ---- */
  const beforeBelt=beltOf(S.xp-totalXP).i;
  const wasUnder = todayXp() < (S.goal||260);
  addTodayXp(totalXP);
  leagueBump(totalXP);
  if((G.lost|0)===0) S.perfects=(S.perfects||0)+1;
  const doneQ=[
    ...questBump('lesson',1),
    ...questBump('xp',totalXP),
    ...((G.lost|0)===0 ? questBump('perfect',1) : [])
  ];
  const goalHit = wasUnder && todayXp() >= (S.goal||260);
  const gemGain = (G.lesson.isReview?3:5) + ((G.lost|0)===0 && !G.lesson.isReview?5:0) + (goalHit?10:0);
  S.gem=(S.gem|0)+gemGain;
  const newBadges = checkBadges();
  const beltUp = beltOf(S.xp).i > beforeBelt ? beltOf(S.xp) : null;
  save(); CLOUD.queue();
  const fin = G.lesson.isReview ? null : newlyFinished();
  if(!G.lesson.isReview) JUST_DONE=G.lesson.id;
  sfx('complete');
  if(fzNew) setTimeout(()=>toast('스트릭 보호막을 받았어요 · 하루 빠뜨려도 이어집니다'), 1500);
  setTimeout(()=>{ burst(innerWidth*.25, innerHeight*.45, 40, 1.3); }, 120);
  setTimeout(()=>{ burst(innerWidth*.75, innerHeight*.45, 40, 1.3); }, 330);
  setTimeout(()=>{ burst(innerWidth*.5, innerHeight*.35, 50, 1.5); }, 560);

  const nxt = fin ? null : nextLesson(G.lesson);
  const nxtLabel = !nxt ? ''
    : (nxt.unit!==G.lesson.unit ? '다음 단원 · '+UNITS[nxt.unit].title
                                : '다음 레슨 · '+nxt.title);
  const wl=uniqWrong();
  app.innerHTML=`
  <div class="center-screen">
    ${nekoBlock('cheer','合',146)}
    <h2>${esc(RS.title)}</h2>
    <p class="sub">${esc(G.lesson.title)} · ${bonus?'하트를 하나도 잃지 않았어요. 보너스 +15 XP':'꾸준함이 실력이 됩니다'}</p>
    <div class="scorecards">
      <div class="scard gold"><div class="h">획득 XP</div><div class="v">+${totalXP}</div></div>
      <div class="scard"><div class="h">${RS.tlab}</div><div class="v mono">${RS.time}</div></div>
      <div class="scard shu"><div class="h">${RS.alab}</div><div class="v">${acc}%</div></div>
    </div>
    <p class="sub gemline">${GEM_SVG}<b>+${gemGain}</b> 보석${boostX>1?' · <b>XP 2배</b> 적용':''}${G.best>=5?' · 최고 콤보 '+G.best:''}</p>
    ${goalHit?`<p class="sub win" style="margin-top:14px"><b>오늘 목표 ${S.goal||260} XP 달성.</b> 연속 ${S.streak}일째입니다.</p>`:''}
    ${beltUp?`<p class="sub win" style="margin-top:14px"><b>${beltUp.ko}${josaRo(beltUp.ko)} 올라섰습니다.</b> 누적 ${S.xp} XP.</p>`:''}
    ${doneQ.length?`<p class="sub" style="margin-top:14px">오늘의 과제 ${doneQ.length}개 완료 · <b>+${doneQ.length*QUEST_XP} XP</b></p>`:''}
    ${newBadges.length?`<div class="newbadges">${newBadges.map(b=>
      `<div class="badge on"><div class="bi jp">${b.jp}</div><div class="bl">${esc(b.n)}</div></div>`).join('')}</div>
      <p class="sub">새 배지를 얻었습니다.</p>`:''}
    ${wl.length?`<div class="review"><h3>다시 볼 표현</h3><ul>${wl.map(w=>
      `<li><span class="j">${esc(w.j)}</span><span class="k">${esc(w.m)}</span></li>`).join('')}</ul></div>`:''}
    <div style="width:100%">${nxt
      ? `<button class="cta shu" id="nextBtn">${esc(nxtLabel)}</button>
         <button class="cta ghost" id="homeBtn" style="margin-top:10px">레슨 지도로</button>`
      : `<button class="cta shu" id="homeBtn">계속하기</button>`}</div>
    <button class="linkbtn" id="againBtn">이 레슨 다시 하기</button>
  </div>`;
  petalsOn();
  /* 완주 화면에서는 떠다니는 알약 대신 줄 자체를 도드라지게 — 캐릭터를 가리지 않습니다 */
  countUp(document.querySelector('.scard.gold .v'), totalXP, 950);
  if(beltUp) setTimeout(()=>{ sfx('lvlup');
    burst(innerWidth*.34, innerHeight*.46, 44, 1.5);
    setTimeout(()=>burst(innerWidth*.66, innerHeight*.46, 44, 1.5), 180); }, 950);
  else if(goalHit) setTimeout(()=>{ sfx('goal'); burst(innerWidth*.5, innerHeight*.5, 34, 1.2); }, 950);
  else if(doneQ.length) setTimeout(()=>sfx('quest'), 950);
  $('#homeBtn').onclick=()=>{ sfx('tap'); if(fin) renderFinish(fin); else renderHome(); };
  const nb=$('#nextBtn');
  if(nb) nb.onclick=()=>{ sfx('tap'); startLesson(nxt); };
  $('#againBtn').onclick=replay;
  window.scrollTo(0,0);
}
function renderFail(){
  if(G.lesson.place) return renderPlaceResult(false);
  sfx('fail');
  const wl=uniqWrong();
  app.innerHTML=`

/* ---- 후리가나 — 한자 위에 읽는 법 ---- */
const FURI_KJ='\\u3400-\\u9FFF\\uF900-\\uFAFF々〆ヶ';
const FURI_RUN=new RegExp('['+FURI_KJ+']+','g');
function furiHira(s){ return String(s||'').replace(/[ァ-ヶ]/g, c=>String.fromCharCode(c.charCodeAt(0)-0x60)); }
function furiAlign(j, k){
  const src=String(j||'').replace(/[\s　]/g,'');
  if(!k || !new RegExp('['+FURI_KJ+']').test(src) || /[0-9A-Za-z０-９Ａ-Ｚａ-ｚ~〜～]/.test(src)) return null;
  const segs=[]; const re=new RegExp('(['+FURI_KJ+']+)|([^'+FURI_KJ+']+)','g'); let m;
  while((m=re.exec(src))) segs.push(m[1]?{kj:1,t:m[1]}:{kj:0,t:m[2]});
  const kk=furiHira(k).replace(/[^ぁ-ゖー]/g,'');
  let pat='^';
  for(const s of segs){
    if(s.kj) pat+='([\\u3041-\\u3096ー]+?)';
    else pat+=furiHira(s.t).replace(/[^ぁ-ゖー]/g,'');
  }
  const mm=kk.match(new RegExp(pat+'$')); if(!mm) return null;
  let gi=1; return segs.map(s=>s.kj?{t:s.t, r:mm[gi++], kj:1}:{t:s.t});
}
const FURI_DICT=(()=>{
  const cnt={};
  const add=(key,r)=>{ const o=cnt[key]||(cnt[key]={}); o[r]=(o[r]||0)+1; };
  const feed=o=>{ if(!o||!o.j||!o.k) return; const a=furiAlign(o.j,o.k); if(!a) return;
    a.forEach((s,i)=>{ if(!s.kj) return;
      add(s.t, s.r);
      const nx=a[i+1]; if(nx && !nx.kj){ const c=furiHira(nx.t).replace(/[^ぁ-ゖー]/g,'')[0]; if(c) add(s.t+'|'+c, s.r); }
    }); };
  UNITS.forEach(u=>{ (u.w||[]).forEach(feed); (u.s||[]).forEach(feed); ((u.grammar&&u.grammar.ex)||[]).forEach(feed); });
  const best={}; for(const key in cnt){ const o=cnt[key]; best[key]=Object.keys(o).sort((a,b)=>o[b]-o[a])[0]; }
  const extra={'生':'せい','時':'じ','半':'はん','思':'おも','分':'ふん','円':'えん','年':'ねん','月':'がつ','日':'にち'};
  for(const k in extra) if(!best[k]) best[k]=extra[k];
  return best;
})();
/* 한자 덩어리 하나를 사전으로 읽습니다 — 통째로 없으면 가장 긴 앞부분부터 잘라 봅니다 */
function furiRun(run, nextCh){
  if(nextCh && FURI_DICT[run+'|'+nextCh]) return [{t:run, r:FURI_DICT[run+'|'+nextCh]}];
  if(FURI_DICT[run]) return [{t:run, r:FURI_DICT[run]}];
  const out=[]; let i=0;
  while(i<run.length){
    let hit=null;
    for(let L=run.length-i; L>=1; L--){
      const part=run.substr(i,L), nc=(i+L===run.length)?nextCh:null;
      const r=(nc&&FURI_DICT[part+'|'+nc])||FURI_DICT[part];
      if(r){ hit={t:part, r}; break; }
    }
    if(!hit) hit={t:run[i], r:null};
    out.push(hit); i+=hit.t.length;
  }
  return out;
}
function furiHTML(text){
  const s=String(text); let h='', last=0, m;
  FURI_RUN.lastIndex=0;
  while((m=FURI_RUN.exec(s))){
    h+=esc(s.slice(last, m.index));
    const nc=furiHira(s.slice(m.index+m[0].length).replace(/^[\s　]+/,''))[0];
    furiRun(m[0], /[ぁ-ゖ]/.test(nc||'')?nc:null).forEach(p=>{
      h+= p.r ? `<ruby>${esc(p.t)}<rt>${esc(p.r)}</rt></ruby>` : esc(p.t);
    });
    last=m.index+m[0].length;
  }
  return h+esc(s.slice(last));
}
const FURI_SKIP='.topbar,.node,.unitband .num,.du-unit .num,.badgerow,.beltchip,.hero h1,.kbd,.typebox,ruby,rt,script,style,textarea,input,[data-nofuri],.du-tabs,.du-flag,.lgname,.ob-flag';
function furiOn(){ return S.furi!==false && S.furi!==0; }
function furiWalk(root){
  if(!furiOn() || !root) return;
  const tw=document.createTreeWalker(root, NodeFilter.SHOW_TEXT, {acceptNode(n){
    if(!n.nodeValue || !new RegExp('['+FURI_KJ+']').test(n.nodeValue)) return NodeFilter.FILTER_REJECT;
    const p=n.parentElement; if(!p || p.closest(FURI_SKIP)) return NodeFilter.FILTER_REJECT;
    return NodeFilter.FILTER_ACCEPT; }});
  const list=[]; while(tw.nextNode()) list.push(tw.currentNode);
  list.forEach(n=>{
    const html=furiHTML(n.nodeValue);
    if(html.indexOf('<ruby>')<0) return;
    const span=document.createElement('span'); span.className='furi'; span.innerHTML=html;
    n.parentNode.replaceChild(span, n);
    const q=span.closest('.qjp'); if(q){ const kn=q.parentNode.querySelector('.qkana'); if(kn) kn.style.display='none'; }
  });
}
let FURI_BUSY=false;
const FURI_MO=new MutationObserver(ms=>{
  if(FURI_BUSY || !furiOn()) return;
  FURI_BUSY=true;
  try{ ms.forEach(m=>m.addedNodes.forEach(n=>{
    if(n.nodeType===1) furiWalk(n);
    else if(n.nodeType===3 && n.parentElement) furiWalk(n.parentElement);
  })); } finally { FURI_BUSY=false; }
});
FURI_MO.observe(document.body, {childList:true, subtree:true});
function furiToggle(){ S.furi = furiOn()?0:1; save(); location.reload(); }

        <div class="sb"><div class="st">${esc(s.title)}</div><div class="ss">${esc(s.sub)}</div></div>
        <div class="sx">미리 하기</div></button>`).join(''));
    box.querySelectorAll('[data-story-try]').forEach(b=>b.onclick=()=>{
      sfx('tap'); DU_STORY_FREE.add(b.dataset.storyTry); startStory(b.dataset.storyTry); });
  }
  if(P.practice.querySelectorAll('.srscard,.du-pbtn,.storylist').length===0)
    P.practice.insertAdjacentHTML('beforeend','<div class="du-empty">레슨을 하나 끝내면 여기에 복습 거리가 생겨요.</div>');

  /* ---- 학습 (레슨 길) ---- */
  mv(path,'learn');
  duPath(path);

  /* 남은 빈 껍데기 정리 후 조립 */
  [...app.children].forEach(el=>{ if(el!==top && !el.classList.contains('du-pane') && !el.id) el.remove(); });
  Object.values(P).forEach(p=>app.appendChild(p));
  app.insertAdjacentHTML('beforeend', duTabsHTML(DU_TAB));
  duBindTabs();
  if(top) document.documentElement.style.setProperty('--du-top', top.offsetHeight+'px');

  /* 스크롤 — 방금 끝낸 자리, 아니면 지금 할 레슨 */
  const fresh=app.querySelector('.node.justdone');
  if(DU_TAB==='learn'){
    const cur=fresh || app.querySelector('.node.du-cur');
    if(cur && (fresh || DU_SCROLL)) cur.scrollIntoView({block:'center'});
  } else if(DU_SCROLL) window.scrollTo(0,0);
  DU_SCROLL=false;
}

function duPath(path){
  const secs=[...new Set(UNITS.map(x=>x.track))];
  path.querySelectorAll('.trackhead').forEach((th,i)=>{
    const thl=th.querySelector('.thl');
    if(thl) thl.insertAdjacentHTML('afterbegin', `<div class="du-sec">섹션 ${i+1}</div>`);
  });
  path.querySelectorAll('.unitband').forEach(band=>{
    const ls=band.nextElementSibling;
    const n0=ls && ls.querySelector('[data-lesson]');
    const L0=n0 && LESSONS.find(l=>l.id===n0.dataset.lesson);
    if(!L0) return;
    const t=band.querySelector('.ub-t');
    if(t) t.insertAdjacentHTML('afterbegin', `<div class="du-ul">${esc(duUnitLabel(L0))}</div>`);
    const g=band.querySelector('.gbtn');
    if(g) g.innerHTML=DU_NODE.book+'<span>가이드북</span>';
    if(!isOpen(L0) && !S.done[L0.id]){
      if(ls) ls.insertAdjacentHTML('afterbegin', `<div class="du-jumprow"><button class="du-jumpu" data-jump="${L0.id}">${DU_NODE.star}<span>여기로 건너뛰기</span></button></div>`);
    }
  });
  path.querySelectorAll('[data-jump]').forEach(b=>b.onclick=ev=>{
    ev.stopPropagation(); sfx('tap');
    const L=LESSONS.find(l=>l.id===b.dataset.jump); if(L) duSkipSheet(L); });

  let first=true;
  path.querySelectorAll('.node[data-lesson]').forEach(b=>{
    const L=LESSONS.find(l=>l.id===b.dataset.lesson); if(!L) return;
    const done=!!S.done[L.id], open=isOpen(L);
    const stars=b.querySelector('.stars');
    b.innerHTML = (done ? DU_NODE.check : (open ? DU_NODE[duKind(L)] : DU_NODE[duKind(L)])) + (stars?stars.outerHTML:'');
    b.classList.add('du-n','k-'+duKind(L));
    if(!open && !done){
      b.disabled=false; b.classList.add('du-locked');
      b.setAttribute('aria-label', b.getAttribute('aria-label').replace(' (잠김)','')+' (잠김 · 눌러서 건너뛰기)');
      b.onclick=()=>{ sfx('tap'); duSkipSheet(L); };
      const row=b.closest('.node-row'); if(row) row.classList.add('du-lockrow');
    } else if(open && !done && first){
      first=false; b.classList.add('du-cur');
      const crow=b.closest('.node-row'); if(crow) crow.classList.add('du-currow');
      b.insertAdjacentHTML('beforeend', `<span class="du-start">${S.done && Object.keys(S.done).length?'시작':'여기서 시작'}</span>`);
    }
  });
}

/* ---------------- 건너뛰기 ---------------- */
function duTrackOf(L){ return TRACKS[L.track]||LESSONS; }
function duSkipSheet(L){
  closeSheet();
  const t=duTrackOf(L), i=t.indexOf(L);
  const skipped=t.slice(0,i).filter(l=>!S.done[l.id]);
  const u=UNITS[L.unit];
  const bg=document.createElement('div'); bg.className='sheet-bg'; bg.id='sheetBg';
  const sh=document.createElement('div'); sh.className='sheet du-skip'; sh.id='sheet';
  sh.innerHTML=`<h3>여기로 건너뛸까요?</h3>
    <p><b>${esc(u?u.title:'')}</b> · ${esc(L.title)}<br>앞에 아직 안 한 레슨이 ${skipped.length}개 있어요.</p>
    <button class="cta" id="duJump">건너뛰기 테스트 보기</button>
    <div class="du-note">앞 과정에서 12문제 · 하트 3개. 통과하면 앞 레슨이 모두 완료로 바뀌고 여기부터 이어집니다.</div>
    <button class="cta ghost" id="duTry">테스트 없이 이 레슨만 해보기</button>
    <div class="du-note">앞 레슨은 그대로 두고 이 레슨만 먼저 해 봅니다. 끝내면 다음 레슨도 열려요.</div>
    <button class="linkbtn" id="duNo" style="width:100%">취소</button>`;
  document.body.append(bg, sh);
  requestAnimationFrame(()=>sh.classList.add('show'));
  bg.onclick=closeSheet;
  sh.querySelector('#duNo').onclick=closeSheet;
  sh.querySelector('#duJump').onclick=()=>{ closeSheet(); sfx('tap'); startJump(L); };
  sh.querySelector('#duTry').onclick=()=>{ closeSheet(); sfx('tap'); startLesson(L); };
}
function startJump(L){
  if(!L) return renderHome();
  const t=duTrackOf(L), i=t.indexOf(L);
  let pool=t.slice(0,i).filter(l=>!S.done[l.id] && !l.review);
  if(!pool.length) pool=t.slice(0,i).filter(l=>!l.review);
  if(!pool.length) return startLesson(L);
  const n=Math.min(pool.length, 12), picked=[];
  for(let k=0;k<n;k++){ const x=pool[Math.round((pool.length-1)*(n===1?1:(k/(n-1))))]; if(picked.indexOf(x)<0) picked.push(x); }
  const per=Math.ceil(12/picked.length);
  let ex=[];
  picked.forEach(l=>{ try{ ex=ex.concat(shuffle(makeExercises(l).filter(e=>e.kind!=='match' && e.kind!=='speak')).slice(0,per)); }catch(_){} });
  ex=shuffle(ex).slice(0,12);
  if(!ex.length) return startLesson(L);
  G=newGame({id:'__jump', title:'건너뛰기 테스트', isReview:true, jump:L.id}, ex);
  G.hearts=3;
  renderExercise();
}
function duJumpResult(pass){
  const L=LESSONS.find(l=>l.id===G.lesson.jump);
  const d=dayKey(new Date());
  if(pass && L){
    const t=duTrackOf(L), i=t.indexOf(L);
    t.slice(0,i).forEach(l=>{ S.done[l.id]=Math.max(S.done[l.id]||0, 1); });
    S.chest=S.chest||{};
    UNITS.forEach(u=>{ if(u.lessons && u.lessons.every(l=>S.done[l.id]) && !S.chest[u.id]) S.chest[u.id]=d; });
    if(typeof trackDone==='function' && S.doneAt)
      Object.keys(TRACKS).forEach(k=>{ if(trackDone(k) && !S.doneAt[k]) S.doneAt[k]=Date.now(); });
    S.xp+=30; addTodayXp(30); if(typeof leagueBump==='function') leagueBump(30);
    if(!S.firstDay) S.firstDay=d;
    bumpStreak();
    save(); if(typeof CLOUD!=='undefined' && CLOUD.queue) CLOUD.queue();
  }
  sfx(pass?'complete':'fail');
  if(pass) setTimeout(()=>burst(innerWidth*.5, innerHeight*.4, 50, 1.4), 150);
  const u=L && UNITS[L.unit];
  app.innerHTML=`
  <div class="center-screen">
    ${nekoBlock(pass?'cheer':'idle', pass?'合':'', 146)}
    <h2>${pass?'건너뛰기 성공!':'아쉽게 통과하지 못했어요'}</h2>
    <p class="sub">${pass
      ? '앞 레슨을 모두 완료로 바꿨어요 · +30 XP'
      : '틀린 게 '+(G.lost|0)+'개예요. 다시 도전하거나, 테스트 없이 이 레슨만 먼저 해 볼 수 있어요.'}</p>
    <div style="width:100%">
      <button class="cta" id="jpGo">${esc((pass?'바로 시작 · ':'다시 도전하기'))}${pass&&L?esc((u?u.title+' ':'')+L.title):''}</button>
      ${pass?'':`<button class="cta ghost" id="jpTry" style="margin-top:12px">이 레슨만 해보기</button>`}
      <button class="linkbtn" id="jpHome" style="width:100%;margin-top:10px">레슨 지도로</button>
    </div>
  </div>`;
  $('#jpGo').onclick=()=>{ sfx('tap'); pass ? startLesson(L) : startJump(L); };
  const tr=$('#jpTry'); if(tr) tr.onclick=()=>{ sfx('tap'); startLesson(L); };
  $('#jpHome').onclick=()=>{ sfx('tap'); DU_TAB='learn'; if(L) JUST_DONE=L.id; renderHome(); };
  window.scrollTo(0,0);
}

/* ---------------- 레슨 화면 ---------------- */
function duLessonDeco(){
  const e=G && G.queue && G.queue[G.i]; if(!e) return;
  const ko=app.querySelector('.stage .qko');
  if(ko && !ko.closest('.du-say') && (e.kind==='mcq'||e.kind==='assemble'||e.kind==='type') && getComputedStyle(ko).display!=='none'){
    const w=document.createElement('div'); w.className='du-say';
    w.innerHTML=`<div class="du-sayhead">${nekoHead('happy')}</div>`;
    ko.parentNode.insertBefore(w, ko); w.appendChild(ko);
  }
  const qj=app.querySelector('.stage .qjp'), qk=app.querySelector('.stage .qkana');
  if(qj && qk && qk.textContent.replace(/\s+/g,'')===qj.textContent.replace(/\s+/g,'')) qk.style.display='none';
  if(G.lesson && G.lesson.jump){
    const lb=app.querySelector('.prompt-label');
    if(lb && !app.querySelector('.du-jtag')) lb.insertAdjacentHTML('beforebegin','<div class="du-jtag">건너뛰기 테스트</div>');
  }
}
function duHeartsSync(){
  const hn=app.querySelector('.hearts .hn'); if(!hn || !G) return;
  if(hn.textContent!==String(G.hearts)){ hn.textContent=G.hearts; hn.classList.remove('pop'); void hn.offsetWidth; hn.classList.add('pop'); }
  const h=app.querySelector('.hearts'); if(h) h.setAttribute('aria-label','남은 하트 '+G.hearts+'개');
}

/* ---- 기존 화면 함수에 덧씌우기 ---- */
const _duRenderHome=renderHome;
renderHome=function(){ const r=_duRenderHome.apply(this, arguments); try{ duHome(); }catch(err){ console.error(err); } return r; };
const _duRenderShop=renderShop;
renderShop=function(){ const r=_duRenderShop.apply(this, arguments); try{ duAfterSub('shop'); }catch(_){} return r; };
const _duRenderLeague=renderLeague;
renderLeague=async function(){ const r=await _duRenderLeague.apply(this, arguments); try{ if(document.querySelector('.lgscreen, .lgboard, #lgBack')) duAfterSub('league'); }catch(_){} return r; };
const _duRenderEx=renderExercise;
renderExercise=function(){ const r=_duRenderEx.apply(this, arguments); try{ duLessonDeco(); }catch(err){ console.error(err); } return r; };
heartsHTML=function(){ return `<span class="h${G.hearts<=0?' off':''}">${ICON.heart}</span><b class="hn mono">${G.hearts}</b>`; };
const _duJudge=judge;
judge=function(){ const r=_duJudge.apply(this, arguments); try{ duHeartsSync(); }catch(_){} return r; };
const _duResult=renderResult;
renderResult=function(){ if(G && G.lesson && G.lesson.jump) return duJumpResult(true); return _duResult.apply(this, arguments); };
const _duFail=renderFail;
renderFail=function(){ if(G && G.lesson && G.lesson.jump) return duJumpResult(false); return _duFail.apply(this, arguments); };
const _duReplay=replay;
replay=function(){ if(G && G.lesson && G.lesson.jump) return startJump(LESSONS.find(l=>l.id===G.lesson.jump)); return _duReplay.apply(this, arguments); };
const _duStoryOpen=storyOpen;
storyOpen=function(s){ return _duStoryOpen(s) || DU_STORY_FREE.has(s.id); };

/* 키보드 — 1~4 로 보기 고르기, Enter 로 확인·계속 (데스크톱) */
addEventListener('keydown', ev=>{
  const a=document.activeElement;
  if(a && (a.tagName==='INPUT' || a.tagName==='TEXTAREA' || a.isContentEditable)) return;
  if(ev.ctrlKey || ev.metaKey || ev.altKey || document.querySelector('.sheet.show')) return;
  if(/^[1-9]$/.test(ev.key)){
    const o=app.querySelectorAll('.stage .opt')[+ev.key-1];
    if(o && G && !G.answered){ o.click(); ev.preventDefault(); }
  } else if(ev.key==='Enter'){
    const fb=document.querySelector('#fb.show #fbBtn');
    const ck=document.querySelector('#check:not([disabled])');
    if(fb){ fb.click(); ev.preventDefault(); } else if(ck){ ck.click(); ev.preventDefault(); }
  }
});

/* ---- 듀오링고처럼: 뜻 고르기 문제는 나오자마자 그 말을 한 번 들려줍니다 ----
   (읽는 법·병음을 고르는 문제는 소리가 곧 답이라 자동으로 틀지 않습니다) */
function duAutoSay(e){
  if(!e || e.kind!=='mcq' || !e.jp || !e.audio || e.dict || !canSpeak()) return false;
  const it=e.item||{};
  if(e.answer!==it.m) return false;
  if(typeof KANA_ITEMS!=='undefined' && KANA_ITEMS.has(it)) return false;
  return true;
}
const _duRenderEx2=renderExercise;
renderExercise=function(){
  const r=_duRenderEx2.apply(this, arguments);
  try{
    const e=G && G.queue && G.queue[G.i];
    if(duAutoSay(e)) setTimeout(()=>{ if(G && G.queue[G.i]===e && !G.answered) speak(e.audio); }, 350);
  }catch(_){}
  return r;
};

/* ---- 보기 소리: 한국어 뜻 보기도 누르면 한국어로 읽어 줍니다 ----
   대상 언어 보기는 그 언어로, 한국어 보기는 한국어로. '들리는 것을 고르세요'만 조용히. */
let KO_VOICE=null;
function koVoice(){
  if(KO_VOICE || !TTS) return KO_VOICE;
  try{ KO_VOICE=(speechSynthesis.getVoices()||[]).find(v=>v.lang && v.lang.toLowerCase().indexOf('ko')===0)||null; }catch(_){}
  return KO_VOICE;
}
function speakKo(text){
  if(!TTS || !text) return;
  text=String(text).replace(/\s*\([^)]*\)\s*/g,' ').replace(/[~～]/g,'').trim();
  if(!text) return;
  try{
    warmTTS();
    const busy=(TTS_REAL>0 && (Date.now()-TTS_AT)<15000) || speechSynthesis.pending;
    if(busy){ speechSynthesis.cancel(); TTS_REAL=0; }
    const go=()=>{ try{
      const u=new SpeechSynthesisUtterance(text);
      u.lang='ko-KR'; u.rate=1; const v=koVoice(); if(v) u.voice=v;
      u.onend=u.onerror=()=>{ TTS_REAL=Math.max(0,TTS_REAL-1); };
      TTS_REAL++; TTS_AT=Date.now();
      speechSynthesis.speak(u);
    }catch(e){} };
    if(busy) setTimeout(go, 60); else go();
  }catch(e){}
}
optTap=function(e, b){
  const t=optSayText(e, b.dataset.v);
  const bump=()=>{ b.classList.remove('saying'); void b.offsetWidth; b.classList.add('saying'); };
  if(t){ speak(t); bump(); return; }
  if(e && e.kind==='mcq' && canSpeak() && /[가-힣]/.test(b.dataset.v||'')){ speakKo(b.dataset.v); bump(); return; }
  sfx('tap');
};
